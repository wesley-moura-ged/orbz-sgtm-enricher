version: "3.8"

services:
  orbz_enricher:
    # Define the image in Portainer's stack environment.
    image: ${ORBZ_ENRICHER_IMAGE:?Configure ORBZ_ENRICHER_IMAGE in Portainer}
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"
    networks:
      - traefik_public
    environment:
      LISTEN_ADDRESS: ":8080"
      GEOIP_DATABASE_PATH: "/data/GeoLite2-City.mmdb"
      USER_ID_SECRET_FILE: "/run/secrets/orbz_user_id_hmac"
    secrets:
      - orbz_user_id_hmac
    volumes:
      # The updater service will keep the GeoLite2 City database in this volume.
      - geoip_data:/data:ro
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
      labels:
        - "traefik.enable=false"

  geoip_updater:
    # Refreshes GeoLite2 through an image built by this repository. The image
    # reads MaxMind credentials from Docker Secrets, never from environment.
    image: ${ORBZ_GEOIP_UPDATER_IMAGE:?Configure ORBZ_GEOIP_UPDATER_IMAGE in Portainer}
    networks:
      - traefik_public
    environment:
      GEOIP_DATABASE_PATH: "/data"
      GEOIPUPDATE_FREQUENCY_SECONDS: "259200"
    secrets:
      - maxmind_account_id
      - maxmind_license_key
    volumes:
      - geoip_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s

networks:
  traefik_public:
    external: true
    name: ${TRAEFIK_NETWORK:-network_swarm_public}

volumes:
  geoip_data:

secrets:
  orbz_user_id_hmac:
    external: true
  maxmind_account_id:
    external: true
  maxmind_license_key:
    external: true
